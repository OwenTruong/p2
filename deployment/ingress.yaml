apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spacebnb-ingress

spec:
  ingressClassName: webapprouting.kubernetes.azure.com

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-service
                port:
                  number: 80