# docker-compose.test.yml

services:
  test_postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: listing_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d listing_test_db"
        ]
      interval: 2s
      timeout: 5s
      retries: 15