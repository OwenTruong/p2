services:
  auth_service:
    build:
      context: ../..
      dockerfile: services/auth_service/Dockerfile
    container_name: auth-server
    env_file: '.env'
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PASSWORD_SALT: ${PASSWORD_SALT}
      AUTH_PORT: ${AUTH_PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully


  migrate:
    build:
      context: ../..
      dockerfile: services/auth_service/Dockerfile
    command: ["python", "-m", "app.migrate"]
    env_file:
      - .env
    environment:
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"


  postgresql:
    image: postgres:15-alpine
    container_name: database-server
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: '.env'
    ports:
      - '${DB_PORT}:${DB_PORT}'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      
    volumes:
      - auth_pgdata:/var/lib/postgresql/data

volumes:
  auth_pgdata:
