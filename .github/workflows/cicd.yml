name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - architecture
    paths:
      - "infrastructure/**"
      - ".github/workflows/cicd.yml"

  push:
    branches:
      - architecture
    paths:
      - "infrastructure/**"
      - ".github/workflows/cicd.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: infrastructure

  TFSTATE_RESOURCE_GROUP: spacebnb-tfstate-rg
  TFSTATE_STORAGE_ACCOUNT: spacebnbtfstate123
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: dev.terraform.tfstate

  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub receives a short-lived Azure token through OIDC.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ARCHITECTURE }}
          tenant-id: ${{ vars.AZURE_TENANT_ID_ARCHITECTURE }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_ARCHITECTURE }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' \
            --output table
